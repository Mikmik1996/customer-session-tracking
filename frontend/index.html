<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Session Tracking</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login Page -->
  <div id="loginPage" class="page">
    <div class="login-container">
      <h1>Park Session Tracker</h1>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
        <p class="demo-info">Demo: username: <strong>staff</strong> | password: <strong>123456</strong></p>
      </form>
    </div>
  </div>

  <!-- Main Dashboard -->
  <div id="mainPage" class="page" style="display: none;">
    <div class="navbar">
      <h1>🎪 Park Session Tracking</h1>
      <div class="navbar-right">
        <span id="staffName"></span>
        <button onclick="logout()" class="btn btn-danger">Logout</button>
      </div>
    </div>

    <div class="container">
      <!-- Statistics Section -->
      <div class="stats-section">
        <div class="stat-card">
          <h3>People Inside</h3>
          <p id="peopleInside" class="stat-number">0</p>
        </div>
        <div class="stat-card">
          <h3>Active Sessions</h3>
          <p id="activeSessions" class="stat-number">0</p>
        </div>
        <div class="stat-card">
          <h3>Total Sessions</h3>
          <p id="totalSessions" class="stat-number">0</p>
        </div>
      </div>

      <!-- Create Session Section -->
      <div class="section">
        <h2>Create New Session</h2>
        <form id="sessionForm">
          <div class="form-row">
            <div class="form-group">
              <label for="clientName">Client Name</label>
              <input type="text" id="clientName" required>
            </div>
            <div class="form-group">
              <label for="clientContact">Contact Number</label>
              <input type="tel" id="clientContact" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="packageSelect">Package</label>
              <select id="packageSelect" required>
                <option value="">Select a package</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary">Start Session</button>
          </div>
        </form>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('active')">Active Sessions</button>
        <button class="tab-btn" onclick="switchTab('all')">All Sessions</button>
      </div>

      <!-- Active Sessions -->
      <div id="activeTab" class="tab-content active">
        <h2>Active Sessions</h2>
        <div id="activeSesionsList" class="sessions-list"></div>
      </div>

      <!-- All Sessions -->
      <div id="allTab" class="tab-content" style="display: none;">
        <h2>All Sessions (Dashboard & Report)</h2>
        <div id="allSessionsList" class="sessions-list"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
