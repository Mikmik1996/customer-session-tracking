<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiijump Philippines - Login</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      background: linear-gradient(rgba(21,170,191,0.6), rgba(28,126,214,0.75)),
      url('https://images.unsplash.com/photo-1559564121-657e33e9d40b?q=80&w=1200&auto=format&fit=crop')
      no-repeat center center;
      background-size: cover;
    }

    /* ✅ LOGIN CARD */
    .login-container {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 20px;
      width: 420px;

      display: flex;
      flex-direction: column;
      align-items: center;

      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .login-container h2 {
      margin: 0;
      font-size: 26px;
    }

    .subtitle {
      margin-bottom: 25px;
      font-size: 13px;
      letter-spacing: 2px;
      color: #555;
    }

    /* ✅ FORM CENTER */
    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ✅ USERNAME INPUT */
    input[type="text"] {
      width: 90%;
      padding: 14px;
      margin: 10px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 15px;
      outline: none;
      box-sizing: border-box;
    }

    /* ✅ PASSWORD WRAPPER (FIXED) */
    .password-wrapper {
      width: 90%;
      position: relative;
      margin: 10px 0;
    }

    .password-wrapper input {
      width: 100%;
      padding: 14px;
      padding-right: 60px; /* ✅ space for "Show" */
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 15px;
      outline: none;
      box-sizing: border-box;
    }

    /* ✅ SHOW BUTTON INSIDE INPUT */
    .toggle-password {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: #555;
      cursor: pointer;
    }

    /* ✅ INPUT FOCUS */
    input:focus {
      border-color: #1c7ed6;
      box-shadow: 0 0 8px rgba(28,126,214,0.3);
    }

    /* ✅ LOGIN BUTTON */
    button {
      width: 70%;
      padding: 14px;
      margin-top: 20px;
      border-radius: 10px;
      border: none;
      background: #1c7ed6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #1864ab;
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* ✅ FADE */
    .fade-out {
      opacity: 0;
      transition: 0.5s;
    }
  </style>
</head>

<body>

<div class="login-container">

  <h2>Wiijump Philippines</h2>
  <p class="subtitle">ADMIN LOGIN</p>

  <form onsubmit="login(event)">
    
    <!-- ✅ USERNAME -->
    <input type="text" id="username" placeholder="Username" required>

    <!-- ✅ PASSWORD (FIXED ALIGNMENT) -->
    <div class="password-wrapper">
      <input type="password" id="password" placeholder="Password" required>
      <span class="toggle-password" onclick="togglePassword()">Show</span>
    </div>

    <!-- ✅ BUTTON -->
    <button type="submit" id="loginBtn">Login</button>

  </form>

</div>

<script>
function togglePassword() {
  const input = document.getElementById("password");
  const text = document.querySelector(".toggle-password");

  if (input.type === "password") {
    input.type = "text";
    text.innerText = "Hide";
  } else {
    input.type = "password";
    text.innerText = "Show";
  }
}

async function login(e) {
  e.preventDefault();

  const btn = document.getElementById("loginBtn");
  btn.innerText = "Logging in...";
  btn.disabled = true;

  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (data.success) {
      localStorage.setItem("isLoggedIn", "true");

      document.body.classList.add("fade-out");

      setTimeout(() => {
        window.location.href = "/dashboard.html";
      }, 500);

    } else {
      alert("Invalid login (use admin / jump123)");
      btn.innerText = "Login";
      btn.disabled = false;
    }

  } catch (err) {
    console.error(err);
    alert("Server error");
    btn.innerText = "Login";
    btn.disabled = false;
  }
}
</script>

</body>
</html>
