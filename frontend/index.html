<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiijum Philippines - Login</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #15aabf 0%, #1c7ed6 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease;
    }

    .login-container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    }

    .login-container h1 {
      margin-bottom: 30px;
      color: #333;
    }

    .login-container form {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .login-container input {
      width: 85%;
      padding: 14px;
      margin: 12px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
      text-align: center;
      outline: none;
    }

    .login-container input:focus {
      border-color: #1c7ed6;
    }

    .login-container button {
      width: 85%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #1c7ed6;
      color: white;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
    }

    .login-container button:hover {
      background: #1864ab;
    }

    .fade-out {
      opacity: 0;
    }
  </style>
</head>
<body>

<div class="login-container">
  <h1>🎯 Wiijum Philippines</h1>

  <form onsubmit="login(event)">
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit" id="loginBtn">Login</button>
  </form>
</div>

<script>
async function login(e) {
  e.preventDefault();

  const btn = document.getElementById("loginBtn");
  btn.innerText = "Logging in...";
  btn.disabled = true;

  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (data.success) {
      // Store a simple local login flag so dashboard can verify you logged in
      localStorage.setItem("isLoggedIn", "true");
      
      document.body.classList.add("fade-out");

      setTimeout(() => {
        // ✅ CHANGED: Since your backend uses a wildcard routing system to map files, 
        // passing an explicit hash parameter prevents the router from confusing it with index.html
        window.location.href = "/#dashboard";
      }, 500);

    } else {
      // ✅ FIXED: Changed the alert message to show the actual credentials checked by server.js
      alert("Invalid login (use admin / jump123)");
      btn.innerText = "Login";
      btn.disabled = false;
    }

  } catch (error) {
    console.error("Login request error:", error);
    alert("Server error connecting to backend");
    btn.innerText = "Login";
    btn.disabled = false;
  }
}
</script>

</body>
</html>
