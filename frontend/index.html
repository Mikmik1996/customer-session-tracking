<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiijump Philippines - Login</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* ✅ UPDATED: Replaced solid blue with a vibrant trampoline park background image */
      background: linear-gradient(rgba(21, 170, 191, 0.6), rgba(28, 126, 214, 0.75)), 
                  url('https://images.unsplash.com/photo-1559564121-657e33e9d40b?q=80&w=1200&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.95); /* Slightly translucent for a modern glass effect */
      padding: 40px;
      border-radius: 20px;
      width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      backdrop-filter: blur(5px); /* Smoothly blurs the trampoline background behind the card */
    }

    .login-container h1 {
      margin-bottom: 5px;
      color: #1c7ed6;
      font-size: 28px;
    }

    .login-container .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .login-container form {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .login-container input {
      width: 85%;
      padding: 14px;
      margin: 12px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: all 0.2s ease;
    }

    .login-container input:focus {
      border-color: #1c7ed6;
      box-shadow: 0 0 8px rgba(28, 126, 214, 0.2);
    }

    .login-container button {
      width: 85%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #1c7ed6;
      color: white;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s ease;
    }

    .login-container button:hover {
      background: #1864ab;
    }

    .fade-out {
      opacity: 0;
    }
  </style>
</head>
<body>

<div class="login-container">
  <h1>🎯 Wiijump</h1>
  <div class="subtitle">Philippines</div>

  <form onsubmit="login(event)">
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit" id="loginBtn">Login</button>
  </form>
</div>

<script>
async function login(e) {
  e.preventDefault();

  const btn = document.getElementById("loginBtn");
  btn.innerText = "Logging in...";
  btn.disabled = true;

  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (data.success) {
      // Store a simple local login flag so dashboard can verify you logged in
      localStorage.setItem("isLoggedIn", "true");
      
      document.body.classList.add("fade-out");

      setTimeout(() => {
        // ✅ FIXED: Now safely redirects your tab directory location straight to your dashboard panel!
        window.location.href = "/dashboard.html#registration";
      }, 500);

    } else {
      alert("Invalid login (use admin / jump123)");
      btn.innerText = "Login";
      btn.disabled = false;
    }

  } catch (error) {
    console.error("Login request error:", error);
    alert("Server error connecting to backend");
    btn.innerText = "Login";
    btn.disabled = false;
  }
}
</script>

</body>
</html>
