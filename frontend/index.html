<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiijump Philippines - Login</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      background: linear-gradient(rgba(21,170,191,0.6), rgba(28,126,214,0.75)),
                  url('https://images.unsplash.com/photo-1559564121-657e33e9d40b?q=80&w=1200&auto=format&fit=crop')
                  no-repeat center center;
      background-size: cover;
    }

.login-container form {
  display: flex;
  flex-direction: column;
  align-items: center;  
  width: 100%;
}
``

    .login-container {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 20px;
      width: 360px;
      text-align: center;

      backdrop-filter: blur(10px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);

      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .login-container h2 {
      margin: 0;
      font-size: 26px;
      color: #1c4fa3;
      white-space: nowrap;
    }

    .subtitle {
      font-size: 13px;
      color: #555;
      margin-bottom: 25px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .login-container input {
      width: 85%;
      padding: 14px;
      margin: 10px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 15px;
      outline: none;
      transition: 0.25s;
    }


.password-wrapper {
  position: relative;
  width: 85%;
}


    .login-container input:focus {
      border-color: #1c7ed6;
      box-shadow: 0 0 8px rgba(28,126,214,0.3);
    }

    /* Password container */
    .password-wrapper {
      position: relative;
      width: 100%;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 14px;
      color: #666;
      user-select: none;
    }

    .login-container button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #1c7ed6, #339af0);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-container button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      background: linear-gradient(135deg, #1864ab, #228be6);
    }

    .login-container button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .fade-out {
      opacity: 0;
      transition: opacity 0.5s ease;
    }
  </style>
</head>

<body>

<div class="login-container">
  <h2>Wiijump Philippines</h2>
  <p class="subtitle">ADMIN LOGIN</p>

  <form onsubmit="login(event)">
    <input type="text" id="username" placeholder="Username" required>

    <!-- ✅ Password with toggle -->
    <div class="password-wrapper">
      <input type="password" id="password" placeholder="Password" required>
      <span class="toggle-password" id="toggleText" onclick="togglePassword()">Show</span>
    </div>

    <button type="submit" id="loginBtn">Login</button>
  </form>
</div>

<script>
function togglePassword() {
  const password = document.getElementById("password");
  const toggleText = document.getElementById("toggleText");

  if (password.type === "password") {
    password.type = "text";
    toggleText.innerText = "Hide";
  } else {
    password.type = "password";
    toggleText.innerText = "Show";
  }
}

async function login(e) {
  e.preventDefault();

  const btn = document.getElementById("loginBtn");
  btn.innerText = "Logging in...";
  btn.disabled = true;

  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (data.success) {
      localStorage.setItem("isLoggedIn", "true");

      document.body.classList.add("fade-out");

      setTimeout(() => {
        window.location.href = "/dashboard.html";
      }, 500);

    } else {
      alert("Invalid login (use admin / jump123)");
      btn.innerText = "Login";
      btn.disabled = false;
    }

  } catch (error) {
    console.error(error);
    alert("Server error");
    btn.innerText = "Login";
    btn.disabled = false;
  }
}
</script>

</body>
</html>
