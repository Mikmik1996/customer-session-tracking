<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<!-- ✅ FIXED Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  display: flex;
}

/* ✅ SIDEBAR */
.sidebar {
  width: 220px;
  height: 100vh;
  background: #1c4fa3;
  color: white;
}

.sidebar h2 {
  text-align: center;
  padding: 20px 0;
  margin: 0;
  background: #184089;
}

/* ✅ MENU */
.menu button {
  width: 100%;
  padding: 14px;
  border: none;
  background: none;
  color: white;
  text-align: left;
  cursor: pointer;
}

.menu button:hover,
.menu button.active {
  background: #2f6fb3;
}

/* ✅ MAIN */
.main {
  flex: 1;
  padding: 20px;
  background: #f4f6f9;
  height: 100vh;
  overflow: auto;
}

/* ✅ SECTIONS */
.section {
  display: none;
}

.section.active {
  display: block;
}

/* ✅ CENTER REGISTRATION */
#registration.section.active {
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ✅ CARD */
.card {
  background: #7aa6c2;
  padding: 40px;
  border-radius: 25px;
  width: 400px;
  text-align: center;
}

/* ✅ INPUTS */
.card input, .card select {
  width: 80%;
  padding: 14px;
  margin: 12px 0;
  border-radius: 12px;
  border: none;
  text-align: center;
}

/* ✅ BUTTON */
.start {
  width: 85%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: #2b7fc7;
  color: white;
}

/* ✅ MESSAGE */
#msg {
  opacity: 0;
  transition: 0.5s;
  color: green;
  font-weight: bold;
}

/* ✅ TABLE */
table {
  width: 100%;
  border-collapse: collapse;
  background: white;
}

th, td {
  padding: 12px;
  border: 1px solid #ccc;
  text-align: center;
}

th {
  background: #1c7ed6;
  color: white;
}

/* ✅ COLORS */
.normal { color: green; font-weight: bold; }
.warning { color: orange; font-weight: bold; }
.expired { color: red; font-weight: bold; }

/* ✅ BUTTONS */
.remove {
  background: red;
  color: white;
  border: none;
  padding: 6px;
}

.download {
  margin-top: 20px;
  padding: 12px;
  background: #2b7fc7;
  color: white;
  border: none;
}
</style>
</head>

<body>

<!-- ✅ SIDEBAR -->
<div class="sidebar">
  <h2>MENU</h2>

  <div class="menu">
    <button class="active" onclick="setActive(this); showSection('registration')">
      Customer Registration
    </button>
    <button onclick="setActive(this); showSection('dashboard')">
      Dashboard
    </button>
    <button onclick="setActive(this); showSection('reports')">
      Reports
    </button>
    <button onclick="logout()">
      Logout
    </button>
  </div>
</div>

<!-- ✅ MAIN -->
<div class="main">

<!-- ✅ REGISTRATION -->
<div id="registration" class="section active">
  <div class="card">
    <h2>Customer Registration</h2>

    <input type="text" id="name" placeholder="Customer Name">
    <input type="text" id="contact" placeholder="Contact">

    <select id="package">
      <option value="">Select Package</option>
      <option value="1">30 Minutes</option>
      <option value="2">1 Hour</option>
      <option value="3">1.5 Hours</option>
      <option value="4">2 Hours</option>
      <option value="5">Unlimited</option>
    </select>

    <button class="start" onclick="addSession()">Start Session</button>

    <p id="msg"></p>
  </div>
</div>

<!-- ✅ DASHBOARD -->
<div id="dashboard" class="section">
  <h2>Dashboard</h2>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Time In</th>
        <th>Time Out</th>
        <th>Remaining Time</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<!-- ✅ REPORTS -->
<div id="reports" class="section">
  <h2>Reports</h2>

  <div>
    <label>Start:</label>
    <input type="date" id="startDate">

    <label>End:</label>
    <input type="date" id="endDate">

    <button onclick="loadChart()">Filter</button>
  </div>

  <div style="width:100%; max-width:800px; height:500px; margin-top:30px;">
    <canvas id="chart"></canvas>
  </div>

  <button class="download" onclick="downloadCSV()">
    Download CSV
  </button>
</div>

</div> <!-- end main -->

<!-- ✅ ONLY SCRIPT (VERY IMPORTANT) -->
<script src="script.js"></script>

</body>
</html>
