<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiijump Philippines - Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      background: #f4f6f9;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 240px;
      height: 100vh;
      background: #1c4fa3;
      color: white;
      display: flex;
      flex-direction: column;
    }

    .sidebar h2 {
      text-align: center;
      padding: 25px 0;
      margin: 0;
      background: #184089;
    }

    .menu {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .menu button {
      width: 100%;
      padding: 16px;
      border: none;
      background: none;
      color: rgba(255,255,255,0.85);
      text-align: left;
      cursor: pointer;
    }

    .menu button:hover {
      background: #235cb8;
      color: white;
    }

    .menu button.active {
      background: #2f6fb3;
      border-left: 5px solid #fff;
    }

    .menu .logout-btn {
      margin-top: auto;
      background: #143773;
    }

    .main {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .flex-center-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 70vh;
    }

    .card {
      background: #7aa6c2;
      padding: 40px;
      border-radius: 25px;
      width: 420px;
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 12px;
      margin-top: 20px;
    }

    th, td {
      padding: 16px;
      border-bottom: 1px solid #dee2e6;
      text-align: center;
    }

    th {
      background: #1c7ed6;
      color: white;
    }

    .filter-bar {
      background: white;
      padding: 20px;
      border-radius: 12px;
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }

    .filter-bar button, .download {
      padding: 10px 20px;
      background: #1c7ed6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .download {
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="sidebar">
  <h2>Menu</h2>

  <div class="menu">
    <button class="active" onclick="setActive(this); showSection('registration')">Customer Registration</button>
    <button onclick="setActive(this); showSection('dashboard')">Active Tracking Dashboard</button>
    <button onclick="setActive(this); showSection('reports')">Analytics Reports</button>
    <button class="logout-btn" onclick="logout()">Logout System</button>
  </div>
</div>

<div class="main">

  <!-- REGISTRATION -->
  <div id="registration" class="section active">
    <div class="flex-center-container">
      <div class="card">
        <h2>Customer Registration</h2>

        <input type="text" id="name" placeholder="Customer Name">
        <input type="text" id="contact" placeholder="Contact Number">

        <select id="package">
          <option value="" disabled selected>Select Session Package</option>
          <option value="1">30 Minutes Ticket</option>
          <option value="2">1 Hour Ticket</option>
          <option value="3">1.5 Hours Ticket</option>
          <option value="4">2 Hours Ticket</option>
          <option value="5">Unlimited Pass Ticket</option>
        </select>

        <button onclick="addSession()">Start Session</button>

        <p id="msg"></p>
      </div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="section">
    <h2>Dashboard</h2>
    <table>
      <thead>
        <tr>
          <th>Customer</th>
          <th>Time-In</th>
          <th>Time-Out</th>
          <th>Remaining</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- REPORTS -->
  <div id="reports" class="section">
    <h2>Activity Reports</h2>

    <div class="filter-bar">
      <input type="date" id="startDate">
      <input type="date" id="endDate">
      <button onclick="loadChart()">Filter</button>
    </div>

 
    <div style="width:100%; max-width:850px; height:450px; margin-top:30px; background:white; padding:20px; border-radius:12px;">
      <canvas id="chart"></canvas>
    </div>

    <button class="download" onclick="downloadCSV()">Export Data</button>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
